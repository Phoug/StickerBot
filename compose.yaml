services:
  api:
    image: sticker-bot:latest
    build:
      context: .
    command:
      - python3
      - -m
      - uvicorn
      - main:app
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "8000:8000"
    env_file:
      - .env

  bot:
    image: sticker-bot:latest
    pull_policy: never
    command:
      - python3
      - bot.py
    env_file:
      - .env
