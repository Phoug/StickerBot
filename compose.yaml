services:
  api:
    image: yavika/sticker-bot:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["python3", "-m", "uvicorn", "backend.main:app", "--host=0.0.0.0", "--port=8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - sticker-data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 20s

  bot:
    image: yavika/sticker-bot:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["python3", "run_bot.py"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VIDEO_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  sticker-data:
