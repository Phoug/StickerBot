services:
  api:
    image: yavika/sticker-bot:${IMAGE_TAG:?IMAGE_TAG is required}

    command:
      - python3
      - -m
      - uvicorn
      - main:app
      - --host=0.0.0.0
      - --port=8000
    
    ports:
      - "8000:8000"
    
    env_file:
      - .env

  bot:
    image: yavika/sticker-bot:${IMAGE_TAG:?IMAGE_TAG is required}
    
    command:
      - python3
      - bot.py
    
    env_file:
      - .env