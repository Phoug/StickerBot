name: Checks

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      skip_image:
        description: The caller checks its own production image.
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            tests/requirements.lock
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.lock -r tests/requirements.lock
          python -m pip check
      - name: Test API, operations and media conversion
        run: python -m pytest tests -q --junitxml=test-results/backend.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-results
          path: test-results/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=junit --outputFile=../test-results/frontend.xml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-results
          path: test-results/
          retention-days: 14

  image:
    if: ${{ !inputs.skip_image }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: stickerbot:check
          build-args: |
            PYTHON_IMAGE=python:3.14-slim-trixie
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=checks
          cache-to: type=gha,scope=checks,mode=max
      - name: Verify the built image without production credentials
        run: python3 scripts/check_image.py stickerbot:check
