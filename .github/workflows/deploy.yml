name: Build and publish Docker image
 
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

env:
  IMAGE_NAME: yavika/sticker-bot

permissions:
  contents: read

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to DHI
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DHI_READ_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_WRITE_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # main → yavika/sticker-bot:main
            type=ref,event=branch
            
            # v0.1.0 → yavika/sticker-bot:0.1.0
            type=semver,pattern={{version}}

            # v0.1.0 → yavika/sticker-bot:0.1
            # v0.1.1 обновит этот тег на новый patch-релиз
            type=semver,pattern={{major}}.{{minor}}

            # Любая сборка → sha-a1b2c3d
            type=sha,format=short,prefix=sha-
      
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Кэш BuildKit между запусками Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max
