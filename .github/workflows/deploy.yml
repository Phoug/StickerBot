name: Build and publish Docker image
 
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  
  # Запуск пайпа вручную
  workflow_dispatch:

env:
  IMAGE_NAME: yavika/sticker-bot

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml
    with:
      skip_image: true

  build:
    name: Build and push
    needs: checks
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}
 
    steps:
      # Копирование репозитория в раннер
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      
      # Раннеру нужен логин в DHI для подгрузки образа
      - name: Login to DHI
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DHI_READ_TOKEN }}

      # Для последующего пуша
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      # Для сборки образа
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # main → yavika/sticker-bot:main
            type=ref,event=branch
            
            # v0.1.0 → yavika/sticker-bot:0.1.0
            type=semver,pattern={{version}}

            # v0.1.0 → yavika/sticker-bot:0.1
            # v0.1.1 обновит этот тег на новый patch-релиз
            type=semver,pattern={{major}}.{{minor}}

            # Любая сборка → sha-a1b2c3d
            type=sha,format=short,prefix=sha-
      
      # Кидаем образ на докерхаб
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          build-args: APP_VERSION=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Кэш BuildKit между запусками Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        run: python3 scripts/check_image.py "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

  # Непосредственно деплой на сервер
  deploy:
    name: Deploy to production
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      # Копирование файлов репозитория в раннер
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      # Загружаем Compose под временным именем.
      - name: Prepare Compose configuration
        run: cp compose.yaml compose.yaml.new

      # Загрузка compose на сервер
      - name: Upload Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          source: compose.yaml.new
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Start release on server
        uses: appleboy/ssh-action@v1.0.3

        env:
          IMAGE_TAG: ${{ needs.build.outputs.version }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          envs: IMAGE_TAG,DEPLOY_PATH
          command_timeout: 5m

          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"

            test -f compose.yaml.new
            test -f .env

            umask 077
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > deploy.env.new

            # Проверяем новый Compose до замены рабочего файла.
            docker compose \
              --env-file deploy.env.new \
              -f compose.yaml.new \
              config --quiet

            # Сохраняем предыдущую конфигурацию для отката.
            if [ -f compose.yaml ]; then
              cp -p compose.yaml compose.yaml.previous
            fi

            if [ -f deploy.env ]; then
              cp -p deploy.env deploy.env.previous
            fi

            # Оба файла соответствуют одному release.
            mv compose.yaml.new compose.yaml
            mv deploy.env.new deploy.env

            docker compose --env-file deploy.env pull

            docker compose --env-file deploy.env up \
              --detach \
              --remove-orphans \
              --wait \
              --wait-timeout 90

            docker compose --env-file deploy.env ps